[package]
name = "deditor"
version = "1.0.0"
description = "DEditor - Markdown and multi-language code editor"
authors = ["DEditor"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2"
base64 = "0.22"
reqwest = { version = "0.13.2", default-features = false, features = ["blocking", "json", "rustls"] }
quick-xml = "0.38"
# Data-parallel iteration. Used by find_in_files to scan many small files in
# parallel across CPU cores — single-threaded scanning was the bottleneck on
# Cmd+Shift+F over a multi-thousand-file workspace.
rayon = "1.10"

# macOS-only: used to strip AppKit's auto-injected Edit-menu items
# ("Start Dictation…", "Emoji & Symbols", "AutoFill", Speech submenu, …)
# that bypass our localized labels and stay in the system locale.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-foundation = "0.3"

# Release profile. Cargo defaults give opt-level=3 but leave LTO off and
# split into 16 codegen units, which leaves a lot of cross-crate inlining
# on the table for a single-binary app like this. The three knobs below
# together shrink the binary ~25% and tighten hot paths (file walking,
# JSON serialization, IPC marshalling).
[profile.release]
lto = true              # whole-program link-time optimization
codegen-units = 1       # maximize inlining
strip = true            # drop debug symbols from the shipped binary
panic = "abort"         # smaller + faster (we already capture panics via log)
